name: Build EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取你的代码
        uses: actions/checkout@v3
      - name: 设置 Python 云端环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: 安装需要的依赖
        run: |
          pip install PySide6
          pip install pyinstaller
      - name: 打包成 EXE 程序
        run: |
          pyinstaller --onefile --windowed --noconsole --add-data "pet.png;." main.py
      - name: 自动生成 EXE 下载链接
        uses: actions/upload-artifact@v3
        with:
          name: DesktopPet_EXE
          path: dist/main.exe
